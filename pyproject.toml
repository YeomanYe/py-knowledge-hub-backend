[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-knowledge-hub-backend"
version = "0.0.1"
description = "Python + FastAPI 实现的知识库管理系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "SQLAlchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "aio-pika>=9.5",
    "elasticsearch>=8.17,<9",
    "aiohttp>=3.10",
    "neo4j>=5.26",
    "boto3>=1.35",
    "openai>=1.57",
    "langchain-text-splitters>=0.3.4",
    "bcrypt>=4.2",
    "PyJWT>=2.10",
    "python-multipart>=0.0.12",
    "aiosmtplib>=3.0",
    "pypdf>=5.1",
    "pdfplumber>=0.11.4",
    "Pillow>=10.4",
    "httpx>=0.27",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
